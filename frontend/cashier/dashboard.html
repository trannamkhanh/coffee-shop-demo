<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thu ngân - Coffee & Tea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="../config.js"></script>
  </head>
  <body class="bg-gray-50 font-sans">
    <!-- NAV -->
    <nav
      class="bg-white shadow-md px-6 py-3 flex items-center justify-between sticky top-0 z-20"
    >
      <div>
        <h1 class="text-lg font-bold text-amber-800">
          <i class="fas fa-cash-register mr-2"></i>Thu ngân
        </h1>
        <span id="user-info" class="text-sm text-gray-500"></span>
      </div>
      <button
        onclick="logout()"
        class="text-gray-500 hover:text-red-600 transition"
      >
        <i class="fas fa-sign-out-alt mr-1"></i>Đăng xuất
      </button>
    </nav>

    <div class="max-w-6xl mx-auto p-4">
      <!-- BÀN ĐANG CÓ KHÁCH -->
      <section class="mb-6">
        <h2 class="text-lg font-semibold text-gray-700 mb-3">
          <i class="fas fa-chair text-green-600 mr-2"></i>Bàn đang có khách
        </h2>
        <div
          id="table-grid"
          class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"
        >
          <!-- JS renders -->
        </div>
      </section>

      <!-- DANH SÁCH HÓA ĐƠN CHỜ THANH TOÁN -->
      <section>
        <h2 class="text-lg font-semibold text-gray-700 mb-3">
          <i class="fas fa-file-invoice text-amber-600 mr-2"></i>Hóa đơn chờ
          thanh toán
        </h2>
        <div id="invoice-list" class="space-y-3">
          <!-- JS renders -->
        </div>
      </section>
    </div>

    <!-- MODAL CHI TIẾT HÓA ĐƠN -->
    <div
      id="invoice-modal"
      class="fixed inset-0 bg-black/50 z-30 hidden items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-2xl w-full max-w-md max-h-[80vh] overflow-y-auto shadow-2xl"
      >
        <div class="p-5">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-gray-800">
              <i class="fas fa-receipt mr-2 text-amber-700"></i>Hóa đơn
            </h3>
            <button
              onclick="closeModal()"
              class="text-gray-400 hover:text-gray-600 text-xl"
            >
              &times;
            </button>
          </div>
          <div id="modal-body"></div>
        </div>
      </div>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
