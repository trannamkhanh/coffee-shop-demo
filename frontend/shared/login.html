<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Coffee & Tea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="../config.js"></script>
  </head>
  <body
    class="bg-gradient-to-br from-amber-800 to-amber-950 min-h-screen flex items-center justify-center p-4"
  >
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm">
      <div class="text-center mb-8">
        <i class="fas fa-mug-hot text-5xl text-amber-700 mb-3"></i>
        <h1 class="text-2xl font-bold text-gray-800">Coffee & Tea</h1>
        <p class="text-gray-500 text-sm mt-1">Đăng nhập hệ thống quản lý</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            <i class="fas fa-user mr-1"></i>Tên đăng nhập
          </label>
          <input
            id="username"
            type="text"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition"
            placeholder="Nhập tên đăng nhập"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            <i class="fas fa-lock mr-1"></i>Mật khẩu
          </label>
          <input
            id="password"
            type="password"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition"
            placeholder="Nhập mật khẩu"
          />
        </div>
        <button
          id="btn-login"
          class="w-full bg-amber-700 hover:bg-amber-800 text-white py-2.5 rounded-lg font-semibold transition shadow-md"
        >
          <i class="fas fa-sign-in-alt mr-1"></i>Đăng nhập
        </button>
      </div>
    </div>

    <script>
      const API = window.APP_CONFIG?.API_BASE_URL || "/api";

      document.getElementById("btn-login").addEventListener("click", login);
      document.getElementById("password").addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
      });

      async function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        if (!username || !password) {
          Swal.fire("Lỗi", "Vui lòng nhập đầy đủ thông tin", "warning");
          return;
        }

        try {
          const formData = new URLSearchParams();
          formData.append("username", username);
          formData.append("password", password);

          const res = await fetch(`${API}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData,
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Đăng nhập thất bại");
          }

          const data = await res.json();
          localStorage.setItem("token", data.access_token);
          localStorage.setItem("chuc_vu", data.chuc_vu);
          localStorage.setItem("ho_ten", data.ho_ten);

          if (data.chuc_vu === "Admin") {
            window.location.href = "../admin/dashboard.html";
          } else {
            window.location.href = "../cashier/dashboard.html";
          }
        } catch (err) {
          Swal.fire("Lỗi", err.message, "error");
        }
      }
    </script>
  </body>
</html>
