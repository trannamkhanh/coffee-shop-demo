<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gọi món - Coffee & Tea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../config.js"></script>
  </head>
  <body class="bg-gray-50 font-sans">
    <div id="app" class="max-w-lg mx-auto pb-24">
      <!-- HEADER -->
      <div
        class="bg-gradient-to-r from-amber-700 to-amber-900 text-white p-4 sticky top-0 z-10 shadow-lg"
      >
        <h1 class="text-xl font-bold">
          <i class="fas fa-mug-hot mr-2"></i>Coffee & Tea
        </h1>
        <p id="table-info" class="text-sm text-amber-200 mt-1">
          <i class="fas fa-chair mr-1"></i>Bàn: <span id="ban-label">---</span>
        </p>
      </div>

      <!-- DANH MỤC -->
      <div
        id="category-tabs"
        class="flex overflow-x-auto gap-2 p-3 bg-white shadow-sm sticky top-[72px] z-10"
      >
        <button
          class="category-btn px-4 py-2 rounded-full text-sm font-medium bg-amber-600 text-white"
          data-category="all"
        >
          Tất cả
        </button>
      </div>

      <!-- DANH SÁCH MÓN -->
      <div id="menu-list" class="p-3 space-y-3">
        <!-- JS renders here -->
      </div>
    </div>

    <!-- GIỎ HÀNG FLOATING -->
    <div
      id="cart-bar"
      class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-2xl p-3 hidden"
    >
      <div class="max-w-lg mx-auto flex items-center justify-between">
        <div>
          <span class="text-sm text-gray-500">Số lượng:</span>
          <span id="cart-count" class="text-lg font-bold text-amber-700"
            >0</span
          >
          <span class="mx-2 text-gray-300">|</span>
          <span class="text-sm text-gray-500">Tạm tính:</span>
          <span id="cart-total" class="text-lg font-bold text-red-600">0₫</span>
        </div>
        <button
          id="btn-order"
          class="bg-amber-700 hover:bg-amber-800 text-white px-6 py-2 rounded-lg font-semibold shadow-md transition"
        >
          <i class="fas fa-paper-plane mr-1"></i>Gửi đơn
        </button>
      </div>
    </div>

    <script src="menu.js"></script>
  </body>
</html>
